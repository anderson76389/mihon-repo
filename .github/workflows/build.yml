name: Build and Deploy Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Extension & Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Static Keystore & Fingerprint
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias mihonkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "UniversalKey2026!" \
            -keypass "UniversalKey2026!" \
            -dname "CN=MihonExtension,OU=Dev,O=Repo,L=Paris,ST=IDF,C=FR"

          FINGERPRINT=$(keytool -list -v -keystore release.keystore -alias mihonkey -storepass "UniversalKey2026!" | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "SHA256_FP=$FINGERPRINT" >> $GITHUB_ENV

      - name: Build and Sign APK
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Prepare Distribution Files & Metadata
        run: |
          mkdir -p /tmp/deploy/apk /tmp/deploy/icon
          touch /tmp/deploy/.nojekyll

          cp app/build/outputs/apk/release/*.apk /tmp/deploy/apk/frenchsources.apk

          curl -sL "https://raw.githubusercontent.com/keiyoushi/extensions/repo/icon/eu.kanade.tachiyomi.extension.fr.mangasorigines.png" -o "/tmp/deploy/icon/eu.kanade.tachiyomi.extension.fr.frenchsources.png" || true

          cat << EOF > /tmp/deploy/repo.json
          {
            "meta": {
              "name": "Sources Françaises",
              "website": "https://github.com/anderson76389/mihon-repo",
              "signingKeyFingerprint": "${{ env.SHA256_FP }}"
            }
          }
          EOF

          cat << 'EOF' > /tmp/deploy/index.min.json
          [{"name":"Sources Françaises","pkg":"eu.kanade.tachiyomi.extension.fr.frenchsources","apk":"frenchsources.apk","lang":"fr","code":1,"version":"1.0.0","nsfw":0,"hasReadme":0,"hasChangelog":0,"sources":[{"name":"Mangas Origines","lang":"fr","id":1849204817491,"baseUrl":"https://mangas-origines.fr"},{"name":"Sushi-Scan","lang":"fr","id":2958102948192,"baseUrl":"https://sushiscan.net"},{"name":"Scan-Manga","lang":"fr","id":7827492817491,"baseUrl":"https://www.scan-manga.com"}]}]
          EOF

      - name: Deploy to repo branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B repo
          rm -rf app gradle .github .gitignore *.gradle* gradlew* release.keystore
          cp -r /tmp/deploy/* .
          cp /tmp/deploy/.nojekyll .

          git add -A
          git commit -m "Deploy single all-in-one extension" || echo "No changes to commit"
          git push --force origin repo
