name: Build and Deploy Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Extension & Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Create Production Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias mihonkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "UniversalKey2026!" \
            -keypass "UniversalKey2026!" \
            -dname "CN=Mihon,OU=Extension,O=Repo,L=Paris,ST=IDF,C=FR"

          # Extraction de l'empreinte SHA-256 pour Mihon
          FINGERPRINT=$(keytool -list -v -keystore release.keystore -alias mihonkey -storepass "UniversalKey2026!" | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "SHA256_FP=$FINGERPRINT" >> $GITHUB_ENV

      - name: Build Raw APK
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Align & Sign APK (Android Universal Compatibility v1/v2/v3)
        run: |
          mkdir -p repo/apk repo/icon
          RAW_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

          # 1. Alignement mémoire (Zipalign)
          ${ANDROID_HOME}/build-tools/34.0.0/zipalign -v -p 4 "$RAW_APK" repo/apk/aligned.apk

          # 2. Signature complète Google (v1, v2, v3)
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias mihonkey \
            --ks-pass pass:"UniversalKey2026!" \
            --key-pass pass:"UniversalKey2026!" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out repo/apk/frenchsources.apk \
            repo/apk/aligned.apk

          # 3. Nettoyage
          rm -f repo/apk/aligned.apk

      - name: Generate Meta & Repo Files
        run: |
          touch repo/.nojekyll

          # Récupération de l'icône
          curl -sL "https://raw.githubusercontent.com/keiyoushi/extensions/repo/icon/eu.kanade.tachiyomi.extension.fr.mangasorigines.png" -o "repo/icon/eu.kanade.tachiyomi.extension.fr.frenchsources.png" || true

          # Fichier repo.json requis par Mihon
          cat << EOF > repo/repo.json
          {
            "meta": {
              "name": "Sources Françaises",
              "website": "https://github.com/anderson76389/mihon-repo",
              "signingKeyFingerprint": "${{ env.SHA256_FP }}"
            }
          }
          EOF

          # Fichier catalogue index.min.json
          cat << 'EOF' > repo/index.min.json
          [{"name":"Sources Françaises","pkg":"eu.kanade.tachiyomi.extension.fr.frenchsources","apk":"frenchsources.apk","lang":"fr","code":1,"version":"1.0.0","nsfw":0,"hasReadme":0,"hasChangelog":0,"sources":[{"name":"Mangas Origines","lang":"fr","id":"1849204817491","baseUrl":"https://mangas-origines.fr"},{"name":"Sushi-Scan","lang":"fr","id":"2958102948192","baseUrl":"https://sushiscan.net"},{"name":"Scan-Manga","lang":"fr","id":"7827492817491","baseUrl":"https://www.scan-manga.com"}]}]
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: repo
