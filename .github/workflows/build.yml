name: Build and Deploy Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Extension & Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Keystore & Extract Fingerprint
        id: keystore
        run: |
          keytool -genkeypair -v \
            -keystore signingkey.jks \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=MihonExtension,OU=Dev,O=Repo,L=Paris,ST=IDF,C=FR"

          FINGERPRINT=$(keytool -list -v -keystore signingkey.jks -alias androiddebugkey -storepass android | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "SHA256_FP=$FINGERPRINT" >> $GITHUB_ENV

      - name: Build APK
        env:
          KEYSTORE_PATH: ../signingkey.jks
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Prepare Repo Directory & Metadata
        run: |
          mkdir -p repo/apk
          cp app/build/outputs/apk/release/*.apk repo/apk/frenchsources.apk
          touch repo/.nojekyll

          cat << EOF > repo/repo.json
          {
            "meta": {
              "name": "Sources Françaises",
              "website": "https://github.com/anderson76389/mihon-repo",
              "signingKeyFingerprint": "${{ env.SHA256_FP }}"
            }
          }
          EOF

          cat << 'EOF' > repo/index.min.json
          [{"name":"Sources Françaises","pkg":"eu.kanade.tachiyomi.extension.fr.frenchsources","apk":"frenchsources.apk","lang":"fr","code":1,"version":"1.0.0","nsfw":0,"hasReadme":0,"hasChangelog":0,"sources":[{"name":"Mangas Origines","lang":"fr","id":1849204817491,"baseUrl":"https://mangas-origines.fr"},{"name":"Sushi-Scan","lang":"fr","id":2958102948192,"baseUrl":"https://sushiscan.net"},{"name":"Scan-Manga","lang":"fr","id":7827492817491,"baseUrl":"https://www.scan-manga.com"}]}]
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: repo
